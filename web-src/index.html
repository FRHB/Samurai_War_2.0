<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samurai Wars 2.0 - Sandbox</title>
    <style>
      :root {
        --bg-canvas: #0b0f17;
        --panel-bg: rgba(15, 20, 30, 0.88);
        --panel-border: rgba(148, 163, 184, 0.16);
        --surface-card: rgba(255, 255, 255, 0.04);
        --surface-hover: rgba(255, 255, 255, 0.09);
        --text-primary: #f1f5f9;
        --text-muted: #94a3b8;
        --accent-red: #ef4444;
        --accent-blue: #3b82f6;
        --accent-gold: #f59e0b;
        --accent-emerald: #10b981;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 45%, #162033 0%, #0b0f17 72%);
        color: var(--text-primary);
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        user-select: none;
      }

      #game-layout {
        display: flex;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #sidebar {
        width: 312px;
        min-width: 312px;
        max-width: 312px;
        height: 100vh;
        background: var(--panel-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-right: 1px solid var(--panel-border);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px;
        overflow-y: auto;
        z-index: 20;
        box-shadow: 8px 0 30px rgba(0, 0, 0, 0.45);
        transition: width 0.22s ease, min-width 0.22s ease, padding 0.22s ease;
      }

      #sidebar.collapsed {
        width: 52px;
        min-width: 52px;
        max-width: 52px;
        padding: 12px 8px;
        overflow: hidden;
      }

      #sidebar.collapsed .sidebar-collapsible {
        display: none;
      }

      #sidebar::-webkit-scrollbar {
        width: 6px;
      }

      #sidebar::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.25);
        border-radius: 999px;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--panel-border);
      }

      .brand-title {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .brand-title h1 {
        margin: 0;
        font-size: 0.98rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        color: #f8fafc;
      }

      .brand-title span {
        font-size: 0.72rem;
        color: var(--text-muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #sidebar-toggle {
        background: var(--surface-card);
        color: var(--text-primary);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.95rem;
        flex-shrink: 0;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      #sidebar-toggle:hover {
        background: var(--surface-hover);
        border-color: rgba(148, 163, 184, 0.35);
      }

      .sidebar-section {
        background: var(--surface-card);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .section-label {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }

      .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .control-row label {
        font-size: 0.8rem;
        color: #cbd5e1;
        font-weight: 500;
      }

      select {
        background: rgba(15, 23, 42, 0.95);
        color: var(--text-primary);
        border: 1px solid var(--panel-border);
        border-radius: 7px;
        padding: 6px 8px;
        font-size: 0.8rem;
        outline: none;
        cursor: pointer;
        flex: 1;
        max-width: 175px;
      }

      select:hover,
      select:focus {
        border-color: rgba(245, 158, 11, 0.65);
      }

      .button-grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .button-grid-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      button {
        background: rgba(30, 41, 59, 0.85);
        color: var(--text-primary);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 7px;
        padding: 7px 8px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      button:hover {
        background: rgba(51, 65, 85, 0.95);
        border-color: rgba(148, 163, 184, 0.4);
      }

      button:active {
        transform: scale(0.98);
      }

      button.active {
        background: rgba(245, 158, 11, 0.22);
        border-color: var(--accent-gold);
        color: #fde68a;
        box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.35);
      }

      button.team-red.active {
        background: rgba(239, 68, 68, 0.25);
        border-color: var(--accent-red);
        color: #fecaca;
        box-shadow: inset 0 0 0 1px rgba(239, 68, 68, 0.4);
      }

      button.team-blue.active {
        background: rgba(59, 130, 246, 0.25);
        border-color: var(--accent-blue);
        color: #bfdbfe;
        box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.4);
      }

      button.danger-btn:hover {
        background: rgba(220, 38, 38, 0.25);
        border-color: rgba(248, 113, 113, 0.55);
        color: #fecaca;
      }

      .unit-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .unit-btn {
        text-align: left;
        padding: 7px 9px;
        font-size: 0.77rem;
      }

      .status-readout {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.78rem;
      }

      .force-counters {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .force-pill {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 8px;
        border-radius: 7px;
        font-weight: 700;
        font-size: 0.78rem;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid var(--panel-border);
      }

      .force-pill.red {
        border-color: rgba(239, 68, 68, 0.4);
        color: #fca5a5;
      }

      .force-pill.blue {
        border-color: rgba(59, 130, 246, 0.4);
        color: #93c5fd;
      }

      .terrain-badge {
        padding: 7px 9px;
        border-radius: 7px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid var(--panel-border);
        color: #e2e8f0;
        font-size: 0.76rem;
        line-height: 1.35;
      }

      .status-log {
        min-height: 22px;
        font-size: 0.74rem;
        color: #fbbf24;
        line-height: 1.35;
        word-break: break-word;
      }

      #viewport-area {
        position: relative;
        flex: 1;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow: hidden;
      }

      #renderCanvas {
        width: min(82vh, calc(100vw - 360px));
        height: min(82vh, calc(100vw - 360px));
        max-width: 920px;
        max-height: 920px;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        box-shadow:
          0 0 0 3px rgba(148, 163, 184, 0.25),
          0 24px 60px rgba(0, 0, 0, 0.75);
        display: block;
        cursor: crosshair;
      }

      #sidebar.collapsed + #viewport-area #renderCanvas {
        width: min(86vh, calc(100vw - 100px));
        height: min(86vh, calc(100vw - 100px));
      }

      .floating-orders {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-radius: 999px;
        background: var(--panel-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--panel-border);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        z-index: 15;
      }

      .floating-orders button {
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.77rem;
      }

      @media (max-width: 900px) {
        #sidebar {
          width: 268px;
          min-width: 268px;
          max-width: 268px;
        }

        #renderCanvas {
          width: min(74vw, 72vh);
          height: min(74vw, 72vh);
        }
      }
    </style>
  </head>
  <body>
    <div id="game-layout">
      <aside id="sidebar" aria-label="Battlefield Controls">
        <div class="sidebar-header">
          <div class="brand-title sidebar-collapsible">
            <h1>Samurai Wars 2.0</h1>
            <span>Tactical Sandbox</span>
          </div>
          <button id="sidebar-toggle" type="button" title="Toggle Sidebar" aria-label="Toggle Sidebar">
            &#9776;
          </button>
        </div>

        <div class="sidebar-section sidebar-collapsible">
          <div class="section-label">Map &amp; Mode</div>
          <div class="control-row">
            <label for="map-select">Map</label>
            <select id="map-select">
              <option value="river-delta">River Delta</option>
              <option value="kawanakajima-plains">Kawanakajima Plains</option>
              <option value="mountain-pass">Mountain Pass</option>
            </select>
          </div>
          <div class="button-grid-3">
            <button id="mode-sandbox" class="active" type="button">Sandbox</button>
            <button id="mode-practice" type="button">Practice</button>
            <button id="mode-editor" type="button">Map Editor</button>
          </div>
        </div>

        <div class="sidebar-section sidebar-collapsible">
          <div class="section-label">Faction &amp; Action</div>
          <div class="button-grid-2">
            <button id="team-red" class="team-red active" type="button">Team 1 (Red)</button>
            <button id="team-blue" class="team-blue" type="button">Team 2 (Blue)</button>
          </div>
          <div class="button-grid-2">
            <button id="tool-deploy" type="button">Deploy</button>
            <button id="tool-select" class="active" type="button">Move / Select</button>
          </div>
        </div>

        <div class="sidebar-section sidebar-collapsible">
          <div class="section-label">Unit &amp; Formation</div>
          <div id="unit-buttons" class="unit-grid"></div>
          <div class="control-row">
            <label for="formation-size">Formation</label>
            <select id="formation-size">
              <option value="1">Single (1)</option>
              <option value="6">Section (6)</option>
              <option value="10" selected>Squad (10)</option>
              <option value="20">Company (20)</option>
              <option value="40">Battalion (40)</option>
            </select>
          </div>
        </div>

        <div class="sidebar-section sidebar-collapsible">
          <div class="section-label">Simulation</div>
          <div class="button-grid-3">
            <button id="speed-toggle" type="button">Speed: 1x</button>
            <button id="music-toggle" type="button">Music: Off</button>
            <button id="clear-units" class="danger-btn" type="button">Clear</button>
          </div>
        </div>

        <div class="sidebar-section sidebar-collapsible">
          <div class="section-label">Battlefield Telemetry</div>
          <div class="status-readout">
            <div class="force-counters">
              <div id="red-count" class="force-pill red">
                <span>Red</span>
                <span>0</span>
              </div>
              <div id="blue-count" class="force-pill blue">
                <span>Blue</span>
                <span>0</span>
              </div>
            </div>
            <div id="terrain-info" class="terrain-badge">Terrain: River / Water (-45% Speed)</div>
            <div id="status-line" class="status-log"></div>
          </div>
        </div>
      </aside>

      <main id="viewport-area">
        <canvas id="renderCanvas"></canvas>

        <div class="floating-orders" role="toolbar" aria-label="Unit Orders">
          <button id="order-halt" type="button">Halt</button>
          <button id="order-walk" class="active" type="button">Walk</button>
          <button id="order-run" type="button">Run</button>
          <button id="order-hold" type="button">Hold</button>
          <button id="order-fire" type="button">Fire</button>
        </div>
      </main>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
